<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchedule — Evaluaciones</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>📅 SmartSchedule</h2><span>Grupo 3 — USFX</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <a href="/panel.html" class="nav-link"><span class="icon">🏠</span> Panel</a>

      <div class="nav-section">Académico</div>
      <a href="/perfil/index.html" class="nav-link"><span class="icon">👤</span> Mi Perfil Académico</a>
      <a href="/materias/index.html" class="nav-link"><span class="icon">📚</span> Mis Materias</a>
      <a href="/evaluaciones/index.html" class="nav-link active"><span class="icon">📝</span> Evaluaciones</a>
      <a href="/horario/index.html" class="nav-link nav-link-highlight"><span class="icon">📅</span> Mi Horario</a>

      <div class="nav-section" id="nav-admin-section" style="display:none">Admin</div>
      <a href="/usuarios/list.html" class="nav-link admin-only" id="nav-users" style="display:none">
        <span class="icon">👥</span> Usuarios
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info"><strong id="user-name">...</strong><small id="user-role"></small></div>
      </div>
      <button onclick="logout()" class="btn btn-secondary btn-full btn-sm">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <span class="topbar-title">Evaluaciones</span>
      <a href="/evaluaciones/create.html" class="btn btn-primary btn-sm">+ Nueva Evaluación</a>
    </div>
    <div class="page-content">
      <div id="alert-global"></div>
      <div class="card" id="content">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Título</th>
                <th>Materia</th>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Tiempo restante</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="eval-tbody">
              <tr><td colspan="6" class="loading">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/evaluaciones.js"></script>
</body>
</html>
