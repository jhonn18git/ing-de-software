<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchedule — Nueva Evaluación</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>📅 SmartSchedule</h2><span>Grupo 3 — USFX</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <a href="/panel.html" class="nav-link"><span class="icon">🏠</span> Panel</a>
      <a href="/productos/list.html" class="nav-link"><span class="icon">📦</span> Productos</a>
      <div class="nav-section">Mi Horario</div>
      <a href="/horario/index.html" class="nav-link"><span class="icon">📅</span> Mi Horario</a>
      <a href="/materias/list.html" class="nav-link"><span class="icon">📚</span> Materias</a>
      <a href="/disponibilidad/index.html" class="nav-link"><span class="icon">🕐</span> Disponibilidad</a>
      <a href="/evaluaciones/list.html" class="nav-link active"><span class="icon">📝</span> Evaluaciones</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info"><strong id="user-name">...</strong><small id="user-role"></small></div>
      </div>
      <button onclick="logout()" class="btn btn-secondary btn-full btn-sm">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <span class="topbar-title">Nueva Evaluación</span>
      <a href="/evaluaciones/list.html" class="btn btn-secondary btn-sm">← Volver</a>
    </div>
    <div class="page-content">
      <div class="card" style="max-width:480px" id="content">
        <div id="alert-box"></div>
        <form id="eval-form" novalidate>
          <div class="form-group">
            <label>Título</label>
            <input type="text" id="titulo" placeholder="Ej: Parcial 1 - Análisis Matemático" required>
          </div>
          <div class="form-group">
            <label>Materia</label>
            <select id="materia_id" required>
              <option value="">— Selecciona una materia —</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha</label>
            <input type="date" id="fecha" required>
          </div>
          <div class="form-group">
            <label>Tipo</label>
            <select id="tipo">
              <option value="examen">Examen</option>
              <option value="trabajo">Trabajo</option>
              <option value="practica">Práctica</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <div style="display:flex;gap:.75rem;margin-top:.5rem">
            <button type="submit" class="btn btn-primary">Guardar Evaluación</button>
            <a href="/evaluaciones/list.html" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/evaluaciones.js"></script>
</body>
</html>
