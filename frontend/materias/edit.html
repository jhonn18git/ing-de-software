<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchedule — Editar Materia</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header"><h2>📅 SmartSchedule</h2><span>Grupo 3 — USFX</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <a href="/panel.html" class="nav-link"><span class="icon">🏠</span> Panel</a>

      <div class="nav-section">Académico</div>
      <a href="/perfil/index.html" class="nav-link"><span class="icon">👤</span> Mi Perfil Académico</a>
      <a href="/materias/index.html" class="nav-link active"><span class="icon">📚</span> Mis Materias</a>
      <a href="/evaluaciones/index.html" class="nav-link"><span class="icon">📝</span> Evaluaciones</a>
      <a href="/horario/index.html" class="nav-link nav-link-highlight"><span class="icon">📅</span> Mi Horario</a>

      <div class="nav-section" id="nav-admin-section" style="display:none">Admin</div>
      <a href="/usuarios/list.html" class="nav-link admin-only" id="nav-users" style="display:none">
        <span class="icon">👥</span> Usuarios
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info"><strong id="user-name">...</strong><small id="user-role"></small></div>
      </div>
      <button onclick="logout()" class="btn btn-secondary btn-full btn-sm">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <span class="topbar-title">Editar Materia</span>
      <a href="/materias/list.html" class="btn btn-secondary btn-sm">← Volver</a>
    </div>
    <div class="page-content">
      <div class="card" style="max-width:480px">
        <div id="alert-box"></div>
        <form id="materia-form" novalidate>
          <div class="form-group">
            <label>Nombre de la materia</label>
            <input type="text" id="nombre" required>
          </div>
          <div class="form-group">
            <label>Dificultad</label>
            <input type="range" id="dificultad" min="1" max="5" step="1" value="3" class="range-input">
            <div id="star-preview" class="stars-preview"></div>
          </div>
          <div class="form-group">
            <label>Color identificador</label>
            <div class="color-row">
              <input type="color" id="color" value="#3182ce" class="color-picker">
              <span class="color-hint">Este color aparecerá en tu horario</span>
            </div>
          </div>
          <div style="display:flex;gap:.75rem;margin-top:.5rem">
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="/materias/list.html" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/materias.js"></script>
</body>
</html>
