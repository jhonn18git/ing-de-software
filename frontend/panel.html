<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSchedule — Panel</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>📅 SmartSchedule</h2>
      <span>Grupo 3 — USFX</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <a href="/panel.html" class="nav-link active"><span class="icon">🏠</span> Panel</a>

      <div class="nav-section">Académico</div>
      <a href="/perfil/index.html" class="nav-link"><span class="icon">👤</span> Mi Perfil Académico</a>
      <a href="/materias/index.html" class="nav-link"><span class="icon">📚</span> Mis Materias</a>
      <a href="/evaluaciones/index.html" class="nav-link"><span class="icon">📝</span> Evaluaciones</a>
      <a href="/horario/index.html" class="nav-link nav-link-highlight"><span class="icon">📅</span> Mi Horario</a>

      <div class="nav-section" id="nav-admin-section" style="display:none">Admin</div>
      <a href="/usuarios/list.html" class="nav-link admin-only" id="nav-users" style="display:none">
        <span class="icon">👥</span> Usuarios
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info">
          <strong id="user-name">Cargando...</strong>
          <small id="user-role"></small>
        </div>
      </div>
      <button onclick="logout()" class="btn btn-secondary btn-full btn-sm">Cerrar Sesión</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <span class="topbar-title">Panel Principal</span>
    </div>
    <div class="page-content">
      <div id="alert-global"></div>

      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-icon blue">📚</div>
          <div>
            <div class="stat-number" id="stat-materias">—</div>
            <div class="stat-label">Mis materias</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">📝</div>
          <div>
            <div class="stat-number" id="stat-evals" style="font-size:1rem">—</div>
            <div class="stat-label">Próxima eval.</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">⏱️</div>
          <div>
            <div class="stat-number" id="stat-horas-estudio">—</div>
            <div class="stat-label">Horas estudio/sem</div>
          </div>
        </div>
        <div class="stat-card admin-stat" id="stat-card-users" style="display:none">
          <div class="stat-icon blue">👥</div>
          <div>
            <div class="stat-number" id="stat-users">—</div>
            <div class="stat-label">Usuarios</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Bienvenido/a a SmartSchedule</h2>
        </div>
        <p id="welcome-msg" style="color:var(--text-secondary)">Cargando tu información...</p>
        <div style="margin-top:1rem" id="quick-actions"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = await requireSession();
  if (!user) return;

  setUserChip(user);

  if (user.rol === 'admin') {
    document.getElementById('stat-card-users').style.display = 'flex';
  }

  document.getElementById('welcome-msg').innerHTML =
    `Hola, <strong>${escHtml(user.name)}</strong>. Rol: <strong>${escHtml(user.rol)}</strong>.`;

  const qas = document.getElementById('quick-actions');
  qas.innerHTML = `<a href="/horario/index.html" class="btn btn-primary" style="margin-right:.5rem">
    📅 Generar mi horario
  </a>`;
  if (user.rol === 'admin') {
    qas.innerHTML += `<a href="/usuarios/list.html" class="btn btn-secondary">Gestionar Usuarios</a>`;
  }

  try {
    const materias = await api.get('/materias');
    document.getElementById('stat-materias').textContent = materias.length;
    const totalH = materias.reduce((s, m) => s + (m.horas_semana || 0), 0);
    document.getElementById('stat-horas-estudio').textContent = totalH + 'h';
  } catch (_) {}

  try {
    const evals = await api.get('/evaluaciones');
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const proximas = evals
      .map(e => ({ ...e, _d: new Date(e.fecha + 'T00:00:00') }))
      .filter(e => e._d >= hoy)
      .sort((a, b) => a._d - b._d);
    if (proximas.length) {
      const p = proximas[0];
      const diff = Math.round((p._d - hoy) / 86400000);
      document.getElementById('stat-evals').textContent =
        diff === 0 ? '¡Hoy!' : diff === 1 ? 'Mañana' : 'en ' + diff + 'd';
    } else {
      document.getElementById('stat-evals').textContent = 'Ninguna';
    }
  } catch (_) {}

  if (user.rol === 'admin') {
    try {
      const users = await api.get('/usuarios');
      document.getElementById('stat-users').textContent = users.length;
    } catch (_) {}
  }
});
</script>
</body>
</html>
